<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留言板 · XUComer</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="gb">

  <form id="form" class="card" autocomplete="off">
    <div class="acc">
      <span class="acc-state" id="accState" hidden></span>
      <input id="user" class="acc-in" type="text" maxlength="24" placeholder="用户名" autocomplete="username">
      <input id="pass" class="acc-in" type="password" maxlength="64" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn" class="acc-btn" type="button">登录</button>
      <button id="regBtn" class="acc-btn" type="button">注册</button>
      <button id="accOut" class="acc-btn" type="button" hidden>退出登录</button>
    </div>
    <p class="acc-tip" id="accTip">注册后换设备也能删自己的留言，不注册照样可以匿名发言。</p>
    <div class="as" id="as" hidden>
      <span class="as-name">XUComer</span><span class="as-tag" id="asTag">开发者</span>
      <label class="as-pin"><input id="pinBox" type="checkbox"><span id="pinTxt">置顶</span></label>
      <button id="asOut" class="as-out" type="button">退出登录</button>
    </div>
    <div class="id-row">
      <button id="avaBtn" class="ava-pick" type="button" aria-label="头像">
        <img id="avaImg" class="ava-img" alt="" hidden>
        <span id="avaPh" class="ava-ph" aria-hidden="true">+</span>
      </button>
      <input id="nick" type="text" maxlength="24" placeholder="怎么称呼你？（选填）">
      <button id="avaDel" class="ava-del" type="button" aria-label="移除头像" hidden>×</button>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <textarea id="text" maxlength="600" rows="3" placeholder="想说点什么…"></textarea>
    <input id="hp" class="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="bar">
      <span class="msg" id="msg" role="status" aria-live="polite"></span>
      <span class="len" id="len">0 / 600</span>
      <button id="send" type="submit">发表</button>
    </div>
  </form>

  <p class="meta" id="tCount">0 条留言</p>

  <ul class="list" id="list"></ul>

  <div class="foot" id="foot" hidden>
    <button id="prev" class="pg" type="button">上一页</button>
    <span class="pg-no" id="pgNo">1 / 1</span>
    <button id="next" class="pg" type="button">下一页</button>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="app.js"></script>
</body>
</html>
